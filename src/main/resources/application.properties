spring.application.name=stix-taxii-practice
taxii.server.url=https://attack-taxii.mitre.org

# Resilience4j Retry Configuration
resilience4j.retry.instances.taxiiRetry.max-attempts=4
resilience4j.retry.instances.taxiiRetry.wait-duration=2s

# Exponential Backoff
resilience4j.retry.instances.taxiiRetry.enable-exponential-backoff=true
resilience4j.retry.instances.taxiiRetry.exponential-backoff-multiplier=2

# Retry only configured exceptions
resilience4j.retry.instances.taxiiRetry.retry-exceptions=feign.FeignException$TooManyRequests,feign.FeignException$BadGateway,feign.FeignException$ServiceUnavailable,feign.FeignException$GatewayTimeout